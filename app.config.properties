# Single cross-language source of truth for the /health endpoint.
# Precedence: environment variable > this file > built-in default; PORT outranks the per-language *_PORT keys.
# The environment variable that overrides each key below is documented in .env.example.

# app.name and app.version are published verbatim in the /health body AND are what
# --probe requires the answer to carry: a self-check that only graded the document's
# SHAPE would be satisfied by any other application serving a conforming document on
# the same loopback port, and would report this one up while it was down.  Change
# either value here and every implementation follows; change it in only one place and
# the version-consistency gate fails.
#
# Length budget.  --probe reads at most 8192 bytes and refuses a larger answer, which
# is the bound that stops an endpoint streaming without end.  The rendered body is
# 73 + app.name + app.version bytes of UTF-8 (73 = the four keys, the punctuation, the
# 20-character instant and the status), so name and version together must stay under
# 8119 bytes - with the version below, an app.name up to 8114 bytes.  Measured: 8114
# gives a body of exactly 8192 and probes healthy, 8115 gives 8193 and is refused.
# The count is BYTES, not characters: a four-byte emoji spends four of them.  Past the
# budget the probe fails closed against a HEALTHY server, so a container HEALTHCHECK
# reading its exit status restarts a working container.  All three implementations
# apply the identical ceiling and report it with the identical wording.
app.name=only_parent_parent_repo_10_LOC
app.version=1.1.0

health.path=/health

# Wildcard bind: a container probe or an orchestrator cannot reach a listener bound to loopback.
app.host=0.0.0.0

# Three distinct defaults let all three servers run at once on one host without a bind collision.
python.port=8000
node.port=8001
java.port=8002
