# ------------------------------------------------------------------------------
# app.config.properties - the single cross-language source of truth for the
# /health endpoint served by app.py, index.js and User.java.
#
# Java-native properties format: one key and one value per line, joined by a
# single equals sign with no surrounding spaces. java.util.Properties.load()
# reads this file with no code at all, and the Python and JavaScript loaders
# read it in a few lines each, so the project stays completely dependency-free.
#
# Precedence: environment variable > this file > built-in default. PORT overrides the per-language *_PORT keys.
#
# Each key's environment-variable override is documented in .env.example.
#
# Values are deliberately unquoted: Properties keeps quote characters
# literally, so quoting here would put them straight into the health payload.
# For the same reason a key line never carries a trailing comment.
# ------------------------------------------------------------------------------

# --- Application identity -----------------------------------------------------
# Reported verbatim as the "name" and "version" fields of the health payload.
# Overrides: APP_NAME, APP_VERSION.
# app.version must stay in step with pyproject.toml, package.json and
# README.md; the CI version-consistency gate (G10) fails when they disagree.
app.name=only_parent_parent_repo_10_LOC
app.version=1.1.0

# --- Endpoint and binding -----------------------------------------------------
# Overrides: HEALTH_PATH, APP_HOST.
# The wildcard bind address is deliberate: a container health probe or an
# orchestrator cannot reach a listener bound to loopback.
health.path=/health
app.host=0.0.0.0

# --- Per-language listener ports ----------------------------------------------
# Three distinct defaults let all three servers run concurrently on a single
# CI runner without a bind collision, so one job per language needs no port
# juggling. Overrides: PYTHON_PORT, NODE_PORT, JAVA_PORT; the universal PORT
# takes precedence over all three for a single-application container.
python.port=8000
node.port=8001
java.port=8002
